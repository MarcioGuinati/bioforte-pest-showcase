  <!-- Google Tag Manager (Deferred via User Interaction) -->
  <script>
    (function() {
      var gtmLoaded = false;
      function loadGTM() {
        if (gtmLoaded) return;
        gtmLoaded = true;
        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':

        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(window,document,'script','dataLayer','GTM-5PJ9NKS');
        
        // Remove listeners once loaded
        ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach(function(event) {
          window.removeEventListener(event, loadGTM, { passive: true });
        });
      }
      
      // Add interaction listeners
      ['scroll', 'mousemove', 'touchstart', 'keydown'].forEach(function(event) {
        window.addEventListener(event, loadGTM, { passive: true, once: true });
      });
      
      // Fallback: load after 5 seconds if no interaction
      setTimeout(loadGTM, 5000);
    })();
  </script>
